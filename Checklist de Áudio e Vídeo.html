<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checklist de Áudio e Vídeo</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mut:#667085;--bd:#dde1e7;--ac:#2563eb;--ok:#16a34a;--bad:#dc2626;--badbg:#fee2e2;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2027;--tx:#eceff3;--mut:#9aa4b2;--bd:#2c333d;--ac:#5b8cff;--ok:#34d399;--bad:#f87171;--badbg:#3b1d1d;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:20px;margin:4px 0 12px}
.view{display:none}.view.on{display:block}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}
.cnt{font-size:13px;color:var(--mut);margin:6px 0 14px}
.who{font-size:14px;color:var(--mut);margin-bottom:10px;display:flex;justify-content:space-between;gap:8px}
.who a{color:var(--ac);text-decoration:none;font-weight:600}
section,.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:12px}
h2{font-size:15px;margin:2px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
label{display:flex;gap:12px;align-items:flex-start;padding:10px 6px;border-radius:8px}
label+label{border-top:1px solid var(--bd)}
label span{flex:1}
input[type=checkbox]{width:24px;height:24px;flex:none;margin:0;accent-color:var(--ok)}
label.done span{color:var(--mut);text-decoration:line-through}
label.na span{color:var(--mut);font-style:italic}
label.miss{background:var(--badbg);outline:2px solid var(--bad)}
.nab{flex:none;padding:4px 8px;border:1px solid var(--bd);background:transparent;color:var(--mut);border-radius:8px;font:inherit;font-size:12px}
.nab.on{background:var(--mut);color:var(--card)}
.alert{display:none;background:var(--badbg);color:var(--bad);border:1px solid var(--bad);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-weight:600}
input[type=text],textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin-bottom:10px}
.lb{font-size:13px;color:var(--mut);margin:0 0 4px}
.err{color:var(--bad);font-size:13px;margin:-4px 0 8px;display:none}
.btn{width:100%;padding:14px;border:0;border-radius:12px;font:inherit;font-weight:700;background:var(--ac);color:#fff;margin-bottom:8px;display:block;text-align:center;text-decoration:none}
.btn.sec{background:transparent;color:var(--mut);border:1px solid var(--bd)}
.btn.wa{background:#25d366;color:#05301a}
#res{display:none}
pre{white-space:pre-wrap;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;font:inherit;margin:0 0 10px}
.h b{display:block}.h small{color:var(--mut)}
.ri{padding:6px 0;border-top:1px solid var(--bd)}.ri.na{color:var(--mut);font-style:italic}
</style>
</head>
<body>
<main>

<div class="view" id="v-start">
<h1>Checklist de Áudio e Vídeo</h1>
<div class="card">
<p class="lb">Responsável (obrigatório)</p>
<input type="text" id="who" placeholder="Nome do responsável">
<div class="err" id="err">Informe o nome do responsável para continuar.</div>
<p class="lb">Ajudante (opcional)</p>
<input type="text" id="helper" placeholder="Nome do ajudante">
</div>
<button class="btn" id="start">Começar checklist</button>
<button class="btn sec" id="openh">Ver histórico</button>
</div>

<div class="view" id="v-app">
<h1>Checklist de Áudio e Vídeo</h1>
<div class="who"><span id="whotxt"></span><a href="#" id="chg">Alterar</a></div>
<div class="tabs" id="tabs"></div>
<div class="bar"><i id="pb"></i></div>
<div class="cnt" id="cnt"></div>
<div class="alert" id="alert"></div>
<div id="list"></div>
<textarea id="obs" rows="2" placeholder="Observações (opcional)"></textarea>
<button class="btn" id="go">Confirmar checklist</button>
<button class="btn sec" id="reset">Limpar e começar de novo</button>
<div id="res">
<pre id="msg"></pre>
<a class="btn wa" id="wa" target="_blank" rel="noopener">Enviar no WhatsApp</a>
<button class="btn sec" id="copy">Copiar mensagem</button>
</div>
<button class="btn sec" id="openh2">Ver histórico</button>
</div>

<div class="view" id="v-hist">
<h1>Histórico</h1>
<div id="hl"></div>
<button class="btn sec" id="clh">Apagar histórico</button>
<button class="btn" id="back">Voltar</button>
</div>

<div class="view" id="v-rep">
<h1>Relatório do checklist</h1>
<div class="card" id="rinfo"></div>
<div id="rlist"></div>
</div>

</main>
<script>
var NAMES=["Meio de semana","Fim de semana"];
function lists(t){
var pc=["Abrir o OBS Studio","Ligar a câmera virtual do OBS Studio","Abrir o Zoom Meeting e conectar na conta correta","Desabilitar o som de todos e desmarcar a permissão para ligarem o próprio microfone","Zoom: alto-falante igual ao sistema (Fones de ouvido/Alto-falantes Realtek)","Zoom: microfone igual ao sistema (Mic Realtek)","Zoom: conferir se está usando a câmera virtual do OBS","Abrir o JW Library e conferir se todas as mídias estão baixadas"];
if(t==0){pc.push("Conferir as mídias enviadas pelo orador (cântico, foto ou vídeo, se houver)","Criar a playlist no JW Library")}
else{pc.push("Conferir o cântico enviado pelo orador",["Conferir as mídias do orador (imagens e vídeos)",1])}
return [
["Energia e equipamentos",["Ligar o filtro de linha","Ligar o computador principal","Verificar se o amplificador está ligado","Verificar se a mesa de som está ligada","Ligar os dois televisores da tribuna","Ligar o notebook auxiliar","Ligar o tablet"]],
["Computador principal",pc],
["Notebook auxiliar",["Abrir o Zoom Meeting e conectar na reunião","No computador principal, definir o notebook como coanfitrião"]],
["Mesa de som",["Testar o microfone do orador","Testar o microfone do leitor","Testar os microfones volantes","Testar a mídia do JW Library junto com a mesa de som"]]
].map(function(s){return [s[0],s[1].map(function(x){return typeof x=="string"?{t:x}:{t:x[0],na:1}})]})}
var S={who:"",helper:"",cur:0,chk:{},saved:false},$=function(i){return document.getElementById(i)};
function load(){try{var o=JSON.parse(localStorage.getItem("chk2")||"{}");for(var k in o)S[k]=o[k]}catch(e){}}
function save(){try{localStorage.setItem("chk2",JSON.stringify(S))}catch(e){}}
function hist(){try{return JSON.parse(localStorage.getItem("hist2")||"[]")}catch(e){return[]}}
function saveH(h){try{localStorage.setItem("hist2",JSON.stringify(h))}catch(e){}}
function show(v){["start","app","hist","rep"].forEach(function(x){$("v-"+x).classList.toggle("on",x==v)});window.scrollTo(0,0)}
function st(){return S.chk[S.cur]||(S.chk[S.cur]={})}
function all(){var a=[];lists(S.cur).forEach(function(s,i){s[1].forEach(function(it,j){a.push({k:i+"-"+j,it:it})})});return a}
function doneN(){var s=st();return all().filter(function(x){return s[x.k]}).length}
function hideRes(){$("res").style.display="none";$("alert").style.display="none"}
function render(){
$("whotxt").textContent="Responsável: "+S.who+(S.helper?" · Ajudante: "+S.helper:"");
var t=$("tabs");t.innerHTML="";
NAMES.forEach(function(n,i){var b=document.createElement("button");b.textContent=n;b.className=i==S.cur?"on":"";b.onclick=function(){S.cur=i;S.saved=false;save();hideRes();render()};t.appendChild(b)});
var L=$("list");L.innerHTML="";
lists(S.cur).forEach(function(s,i){
var sec=document.createElement("section");sec.innerHTML="<h2>"+s[0]+"</h2>";
s[1].forEach(function(it,j){var k=i+"-"+j,v=st()[k];
var l=document.createElement("label");l.dataset.k=k;
var c=document.createElement("input");c.type="checkbox";c.checked=v===true;c.disabled=v==="na";
var sp=document.createElement("span");sp.textContent=it.t+(v==="na"?" (não se aplica)":"");
l.classList.toggle("done",v===true);l.classList.toggle("na",v==="na");
c.onchange=function(){st()[k]=c.checked?true:undefined;S.saved=false;save();render()};
l.appendChild(c);l.appendChild(sp);
if(it.na){var b=document.createElement("button");b.type="button";b.className="nab"+(v==="na"?" on":"");b.textContent="N/A";
b.onclick=function(e){e.preventDefault();st()[k]=v==="na"?undefined:"na";S.saved=false;save();render()};l.appendChild(b)}
sec.appendChild(l)});
L.appendChild(sec)});
var n=all().length,d=doneN();
$("pb").style.width=(d/n*100)+"%";$("cnt").textContent=d+" de "+n+" itens concluídos"}
var BASE_URL='https://claude.ai/artifact/WaiXH89H9SAXcEtNJ2a1YR';
function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function dec(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(decodeURIComponent(escape(atob(s))))}
function showRep(r){
var d=new Date(r.d),inf=$('rinfo'),na=r.n||[],L=$('rlist');inf.innerHTML='';L.innerHTML='';
[['Reunião',NAMES[r.t]||''],['Data',d.toLocaleDateString('pt-BR')+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})],['Responsável',r.w],['Ajudante',r.h],['Observações',r.o]].forEach(function(x){if(!x[1])return;var p=document.createElement('div');p.className='ri';var b=document.createElement('b');b.textContent=x[0]+': ';p.appendChild(b);p.appendChild(document.createTextNode(x[1]));inf.appendChild(p)});
lists(r.t).forEach(function(s,i){var sec=document.createElement('section'),h=document.createElement('h2');h.textContent=s[0];sec.appendChild(h);s[1].forEach(function(it,j){var p=document.createElement('div'),z=na.indexOf(i+'-'+j)>-1;p.className='ri'+(z?' na':'');p.textContent=(z?'— ':'✅ ')+it.t+(z?' (não se aplica)':'');sec.appendChild(p)});L.appendChild(sec)});
show('rep')}
$("start").onclick=function(){var w=$("who").value.trim();
if(!w){$("err").style.display="block";$("who").focus();return}
S.who=w;S.helper=$("helper").value.trim();save();render();show("app")};
$("chg").onclick=function(e){e.preventDefault();$("who").value=S.who;$("helper").value=S.helper;show("start")};
$("go").onclick=function(){
var miss=[],first=null;
document.querySelectorAll("label").forEach(function(l){if(!st()[l.dataset.k]){l.classList.add("miss");miss.push(l);if(!first)first=l}});
var a=$("alert");
if(miss.length){a.style.display="block";a.textContent="Faltam "+miss.length+" item(ns). Os que faltam estão destacados em vermelho.";$("res").style.display="none";first.scrollIntoView({behavior:"smooth",block:"center"});return}
a.style.display="none";
var d=new Date(),obs=$("obs").value.trim(),n=all().length,nas=all().filter(function(x){return st()[x.k]==="na"}).map(function(x){return x.it.t});
var dt=d.toLocaleDateString("pt-BR")+" às "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
var m="✅ Checklist de áudio e vídeo concluído\n📋 Reunião de "+NAMES[S.cur].toLowerCase()+"\n📅 "+dt+"\n👤 Responsável: "+S.who+(S.helper?"\n🤝 Ajudante: "+S.helper:"")+"\n\nTodos os "+n+" itens foram verificados. Sistema pronto para a reunião."+(nas.length?"\n\nNão se aplica: "+nas.join("; ")+".":"")+(obs?"\n\n📝 Obs.: "+obs:"");
var nak=all().filter(function(x){return st()[x.k]==="na"}).map(function(x){return x.k});
m+='\n\n🔗 Relatório completo: '+BASE_URL+'#r'+enc({d:d.getTime(),t:S.cur,w:S.who,h:S.helper,o:obs,n:nak});
$("msg").textContent=m;
$("wa").href="https://wa.me/?text="+encodeURIComponent(m);
if(!S.saved){var h=hist();h.unshift({dt:dt,tipo:NAMES[S.cur],who:S.who,helper:S.helper,n:n,na:nas.length,obs:obs});saveH(h.slice(0,50));S.saved=true;save()}
$("res").style.display="block";$("res").scrollIntoView({behavior:"smooth"})};
$("copy").onclick=function(){var b=this,m=$("msg").textContent;
try{navigator.clipboard.writeText(m).then(function(){b.textContent="Copiado!"})}catch(e){b.textContent="Selecione e copie o texto acima"}};
$("reset").onclick=function(){S.chk={};S.saved=false;save();$("obs").value="";hideRes();$("who").value=S.who;$("helper").value=S.helper;show("start")};
function showH(){var h=hist(),L=$("hl");L.innerHTML="";
if(!h.length){L.innerHTML='<div class="card">Nenhum checklist concluído ainda.</div>'}
h.forEach(function(e){var c=document.createElement("div");c.className="card h";
var b=document.createElement("b");b.textContent=e.tipo+" · "+e.dt;c.appendChild(b);
var s=document.createElement("small");s.textContent="Responsável: "+e.who+(e.helper?" · Ajudante: "+e.helper:"")+" · "+e.n+" itens"+(e.na?" ("+e.na+" não se aplica)":"")+(e.obs?" · Obs.: "+e.obs:"");c.appendChild(s);L.appendChild(c)});
show("hist")}
$("openh").onclick=showH;$("openh2").onclick=showH;
$("back").onclick=function(){show(S.who?"app":"start")};
$("clh").onclick=function(){if(confirm("Apagar todo o histórico?")){saveH([]);showH()}};
load();$("who").value=S.who;$("helper").value=S.helper;render();show("start");
try{var hh=location.hash;if(hh.length>2&&hh.charAt(1)==='r')showRep(dec(hh.slice(2)))}catch(e){}
</script>
</body>
</html>
